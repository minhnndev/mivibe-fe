name: Mivibe Frontend CI/CD

on:
  push:
    branches:
      - main

env:
  APP_NAME: mivibe-frontend # Mivibe Landing Page + Web Admin
  ENVIRONMENT: Production
  IMAGE_NAME: ghcr.io/minhnndev/mivibe-fe

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # 🔐 Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🧱 Versioning
      - name: Set version
        run: echo "VERSION=v0.0.${{ github.run_number }}" >> $GITHUB_ENV

      # ✅ Validate app before publishing image
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 🏗️ Build image
      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      # 🚀 Push image
      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # 📥 Checkout infra repo
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: meetdy/infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      # ✏️ Update deployment.yaml
      - name: Update image tag
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:$VERSION"
          sed -i \
            "s|image: .*ghcr.io/minhnndev/mivibe-fe:[^[:space:]]*|image: \"$IMAGE_TAG\"|" \
            infra/manifests/mivibe-fe/deployment.yaml

      # 📤 Commit & push
      - name: Commit and push (if changed)
        run: |
          cd infra
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if git diff --quiet manifests/mivibe-fe/deployment.yaml; then
            echo "No image change detected. Skipping commit."
            exit 0
          fi

          git add manifests/mivibe-fe/deployment.yaml
          git commit -m "Mivibe - Web: 🚀 $VERSION"
          git push
